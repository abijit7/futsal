# ============================
# Futsal Booking System Config
# ============================

# Environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
# Use a non-DB port for the Spring Boot server. 3306 is MySQL's default port and
# will cause a port collision if the DB is on the same host.
# PORT is honoured so the app binds wherever the platform expects: Azure App Service on Linux
# defaults to 8080, and Container Apps injects its own value.
server.port=${PORT:9090}

# Behind Azure's reverse proxy the app sees plain HTTP. Without this, absolute URLs built with
# ServletUriComponentsBuilder (upload responses) come out as http:// on an https:// site and are
# blocked as mixed content.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Uploads
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-image-size-bytes=${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}
app.upload.max-image-dimension=${UPLOAD_MAX_IMAGE_DIMENSION:5000}
app.upload.max-image-files=${UPLOAD_MAX_IMAGE_FILES:10}

# Application time
app.time-zone=${APP_TIME_ZONE:Asia/Kathmandu}

# Logging (include requestId from RequestIdFilter)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Rate limiting (per client IP, applied to /api/** only)
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:60}
app.rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:60}
app.rate-limit.refill-minutes=${RATE_LIMIT_REFILL_MINUTES:1}

# How many reverse proxies in front of the app append to X-Forwarded-For. The client address is
# read from that many entries in from the right, because the leftmost entries are supplied by the
# caller and can be forged to mint a fresh bucket per request. 0 disables the header entirely.
app.rate-limit.trusted-proxy-count=${RATE_LIMIT_TRUSTED_PROXY_COUNT:1}

# How often idle (fully refilled) buckets are dropped from memory.
app.rate-limit.sweep-interval-ms=${RATE_LIMIT_SWEEP_INTERVAL_MS:300000}

# Tighter bucket for login / register / password recovery
app.rate-limit.credential.capacity=${RATE_LIMIT_CREDENTIAL_CAPACITY:10}
app.rate-limit.credential.refill-tokens=${RATE_LIMIT_CREDENTIAL_REFILL_TOKENS:10}
app.rate-limit.credential.refill-minutes=${RATE_LIMIT_CREDENTIAL_REFILL_MINUTES:15}

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.jwt.issuer=${JWT_ISSUER:futsal-booking}

# Account verification and password recovery
app.verification.ttl-minutes=${VERIFICATION_TTL_MINUTES:10}
app.verification.resend-cooldown-seconds=${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
app.verification.max-attempts=${VERIFICATION_MAX_ATTEMPTS:5}
app.verification.secret=${VERIFICATION_SECRET:${JWT_SECRET:dev-futsal-verification-secret-change-me-32}}
app.verification.expose-code=${VERIFICATION_EXPOSE_CODE:false}
app.verification.email.enabled=${VERIFICATION_EMAIL_ENABLED:false}
app.verification.email.from=${VERIFICATION_EMAIL_FROM:no-reply@merofutsal.local}
app.verification.sms.webhook-url=${SMS_WEBHOOK_URL:}

# When email delivery is enabled, configure Spring Boot's standard SMTP
# environment variables: SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, and related properties.

# Booking receipts and status-change emails. Separate from the verification toggle so that a
# deployment can run account verification without customer-facing mail, but it defaults to the
# same value because one SMTP setup normally serves both.
app.notifications.email.enabled=${NOTIFICATION_EMAIL_ENABLED:${VERIFICATION_EMAIL_ENABLED:false}}
app.notifications.email.from=${NOTIFICATION_EMAIL_FROM:${VERIFICATION_EMAIL_FROM:no-reply@merofutsal.local}}

# Refunds. eSewa exposes no merchant refund API, so money is returned from the merchant
# dashboard; these settle how the obligation is tracked and how often eSewa is polled for
# confirmation. Refunds are far less time-critical than slot holds, hence the longer interval.
app.refund.sweep-interval-ms=${REFUND_SWEEP_INTERVAL_MS:900000}
app.refund.overdue-hours=${REFUND_OVERDUE_HOURS:48}

# How close to the slot a customer may still cancel online. Admins are never subject to this.
app.booking.cancellation-cutoff-hours=${BOOKING_CANCELLATION_CUTOFF_HOURS:24}

# Payment gateways.
# Defaults point at the eSewa UAT environment. The eSewa merchant secret
# below is the published UAT test key, not a real credential.
payment.esewa.merchant.code=${PAYMENT_ESEWA_MERCHANT_CODE:EPAYTEST}
payment.esewa.merchant.secret=${PAYMENT_ESEWA_MERCHANT_SECRET:8gBm/:&EnhH.1/q}
payment.esewa.form-url=${PAYMENT_ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
# Status host is rc.esewa.com.np for UAT and esewa.com.np/epay.esewa.com.np for production -
# note it is NOT the same host as the form URL above, and uat.esewa.com.np does not resolve.
payment.esewa.status-url=${PAYMENT_ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}

# Where the gateways send the browser back to. Must be the public frontend origin; never taken
# from the client, or a caller could point the callback at a site they control.
app.payment.return-base-url=${PAYMENT_RETURN_BASE_URL:http://localhost:5173}

# How long a checkout may hold a slot before the reconciling sweep frees it. Held slots are only
# released after eSewa confirms the payment never completed.
app.payment.hold-minutes=${PAYMENT_HOLD_MINUTES:60}
app.payment.sweep-interval-ms=${PAYMENT_SWEEP_INTERVAL_MS:300000}

# ============================
# Futsal Booking System Config
# ============================

# Environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
# Use a non-DB port for the Spring Boot server. 3306 is MySQL's default port and
# will cause a port collision if the DB is on the same host. Use 8080 (default)
server.port=8080

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Uploads
app.upload.dir=uploads

# Logging (include requestId from RequestIdFilter)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Rate limiting
app.rate-limit.capacity=60
app.rate-limit.refill-tokens=60
app.rate-limit.refill-minutes=1

# JWT
app.jwt.secret=${JWT_SECRET:dev-futsal-jwt-secret-change-me-32-bytes-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.jwt.issuer=${JWT_ISSUER:futsal-booking}

# ============================
# Futsal Booking System Config
# ============================

# Environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
# Use a non-DB port for the Spring Boot server. 3306 is MySQL's default port and
# will cause a port collision if the DB is on the same host.
server.port=9090

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Uploads
app.upload.dir=uploads
app.upload.max-image-size-bytes=${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}
app.upload.max-image-dimension=${UPLOAD_MAX_IMAGE_DIMENSION:5000}
app.upload.max-image-files=${UPLOAD_MAX_IMAGE_FILES:10}

# Application time
app.time-zone=${APP_TIME_ZONE:Asia/Kathmandu}

# Logging (include requestId from RequestIdFilter)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Rate limiting
app.rate-limit.capacity=60
app.rate-limit.refill-tokens=60
app.rate-limit.refill-minutes=1

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.jwt.issuer=${JWT_ISSUER:futsal-booking}

# Account verification and password recovery
app.verification.ttl-minutes=${VERIFICATION_TTL_MINUTES:10}
app.verification.resend-cooldown-seconds=${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
app.verification.max-attempts=${VERIFICATION_MAX_ATTEMPTS:5}
app.verification.secret=${VERIFICATION_SECRET:${JWT_SECRET:dev-futsal-verification-secret-change-me-32}}
app.verification.expose-code=${VERIFICATION_EXPOSE_CODE:false}
app.verification.email.enabled=${VERIFICATION_EMAIL_ENABLED:false}
app.verification.email.from=${VERIFICATION_EMAIL_FROM:no-reply@merofutsal.local}
app.verification.sms.webhook-url=${SMS_WEBHOOK_URL:}

# When email delivery is enabled, configure Spring Boot's standard SMTP
# environment variables: SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, and related properties.

# Payment Gateway Configuration
# ESEWA Configuration
payment.esewa.merchant.code=${ESEWA_MERCHANT_CODE:EPAYTEST}
payment.esewa.merchant.secret=${ESEWA_MERCHANT_SECRET:test-secret}
payment.esewa.api.url=${ESEWA_API_URL:https://uat.esewa.com.np/epay/main}

# KHALTI Configuration
payment.khalti.secret=${KHALTI_SECRET:test-secret-key}
payment.khalti.public.key=${KHALTI_PUBLIC_KEY:test-public-key}
payment.khalti.api.url=${KHALTI_API_URL:https://khalti.com}

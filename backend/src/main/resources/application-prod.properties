# Production profile
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.jwt.issuer=${JWT_ISSUER:merofutsal-production}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.upload.dir=${UPLOAD_DIR}
app.verification.expose-code=false
app.verification.secret=${VERIFICATION_SECRET:}
app.verification.email.enabled=${VERIFICATION_EMAIL_ENABLED:false}
app.verification.email.from=${VERIFICATION_EMAIL_FROM:no-reply@merofutsal.com}
app.verification.sms.webhook-url=${SMS_WEBHOOK_URL:}

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

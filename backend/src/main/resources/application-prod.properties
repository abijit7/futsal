# Production profile
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.jwt.issuer=${JWT_ISSUER:merofutsal-production}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.upload.dir=${UPLOAD_DIR}
app.verification.expose-code=false
app.verification.secret=${VERIFICATION_SECRET:}
app.verification.email.enabled=${VERIFICATION_EMAIL_ENABLED:false}
app.verification.email.from=${VERIFICATION_EMAIL_FROM:no-reply@merofutsal.com}
app.verification.sms.webhook-url=${SMS_WEBHOOK_URL:}

# Production gateway endpoints. All of these must be set; there are deliberately no defaults.
payment.esewa.merchant.code=${PAYMENT_ESEWA_MERCHANT_CODE}
payment.esewa.merchant.secret=${PAYMENT_ESEWA_MERCHANT_SECRET}
payment.esewa.form-url=${PAYMENT_ESEWA_FORM_URL:https://epay.esewa.com.np/api/epay/main/v2/form}
payment.esewa.status-url=${PAYMENT_ESEWA_STATUS_URL:https://epay.esewa.com.np/api/epay/transaction/status/}
payment.khalti.secret=${PAYMENT_KHALTI_SECRET}
payment.khalti.api.url=${PAYMENT_KHALTI_API_URL:https://khalti.com/api/v2}
app.payment.return-base-url=${PAYMENT_RETURN_BASE_URL}

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

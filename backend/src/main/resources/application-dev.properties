# Development profile
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/futsal_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

management.endpoint.health.show-details=always

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Local development can complete verification without external email/SMS providers.
app.verification.expose-code=${VERIFICATION_EXPOSE_CODE:true}

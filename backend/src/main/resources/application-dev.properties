# Development profile
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/futsal_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

management.endpoint.health.show-details=always

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Local development can complete verification without external email/SMS providers.
app.verification.expose-code=${VERIFICATION_EXPOSE_CODE:true}

# Local payment gateway defaults for development/demo flows.
payment.esewa.merchant.code=${PAYMENT_ESEWA_MERCHANT_CODE:EPAYTEST}
payment.esewa.merchant.secret=${PAYMENT_ESEWA_MERCHANT_SECRET:dev-esewa-secret}
payment.esewa.api.url=${PAYMENT_ESEWA_API_URL:https://rc.esewa.com.np/epay/main}
payment.khalti.secret=${PAYMENT_KHALTI_SECRET:dev-khalti-secret}
payment.khalti.public.key=${PAYMENT_KHALTI_PUBLIC_KEY:dev-khalti-public-key}
payment.khalti.api.url=${PAYMENT_KHALTI_API_URL:https://a.khalti.com/api}

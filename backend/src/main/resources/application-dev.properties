# Development profile
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/futsal_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

management.endpoint.health.show-details=always

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Local development can complete verification without external email/SMS providers.
app.verification.expose-code=${VERIFICATION_EXPOSE_CODE:true}

# Development points at the eSewa UAT and Khalti sandbox environments.
# The eSewa secret is the published UAT test key.
payment.esewa.merchant.code=${PAYMENT_ESEWA_MERCHANT_CODE:EPAYTEST}
payment.esewa.merchant.secret=${PAYMENT_ESEWA_MERCHANT_SECRET:8gBm/:&EnhH.1/q(}
payment.esewa.form-url=${PAYMENT_ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
payment.esewa.status-url=${PAYMENT_ESEWA_STATUS_URL:https://uat.esewa.com.np/api/epay/transaction/status/}
payment.khalti.secret=${PAYMENT_KHALTI_SECRET:test-secret-key}
payment.khalti.api.url=${PAYMENT_KHALTI_API_URL:https://dev.khalti.com/api/v2}
app.payment.return-base-url=${PAYMENT_RETURN_BASE_URL:http://localhost:5173}

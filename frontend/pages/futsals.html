<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Futsal — FutsalBook</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="page-header">
  <div class="container">
    <h1>CHOOSE <span>FUTSAL</span></h1>
    <p>Select a futsal venue to see its available time slots</p>
  </div>
</div>

<div class="container page-wrap">

  <div id="loadingFutsals" class="loading-wrap">
    <div class="spinner"></div>
    <p>Loading futsals...</p>
  </div>

  <div id="futsalsContent" class="hidden">
    <div id="emptyFutsals" class="empty-state hidden">
      <div class="icon">📭</div>
      <h3>No futsals available</h3>
      <p>Please check back later.</p>
    </div>
    <div id="futsalsGrid" class="slots-grid"></div>
  </div>

</div>

<script src="../js/app.js"></script>
<script>
  const apiBase = (typeof API_BASE !== 'undefined') ? API_BASE : 'http://localhost:8080';
  const API_FUTSALS = `${apiBase}/api/futsals`;

  if (typeof resolveImageUrl !== 'function') {
    window.resolveImageUrl = (url) => url || '';
  }
  if (typeof formatTime !== 'function') {
    window.formatTime = (timeStr) => timeStr || '-';
  }
  if (typeof showToast !== 'function') {
    window.showToast = (msg) => console.error(msg);
  }
  if (typeof renderNavbar === 'function') {
    renderNavbar('futsals');
  }

  let allFutsals = [];

  function withTimeout(promise, ms) {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error('Request timed out')), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  }

  async function fetchFutsalsFallback() {
    const res = await fetch(API_FUTSALS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function loadFutsals() {
    try {
      const fetcher = (typeof FutsalAPI !== 'undefined' && FutsalAPI.getAll)
        ? FutsalAPI.getAll()
        : fetchFutsalsFallback();
      allFutsals = await withTimeout(fetcher, 10000);
      renderFutsals(allFutsals);
    } catch (err) {
      showToast('Failed to load futsals: ' + err.message, 'error');
    } finally {
      document.getElementById('loadingFutsals').classList.add('hidden');
      document.getElementById('futsalsContent').classList.remove('hidden');
    }
  }

  function renderFutsals(futsals) {
    const grid = document.getElementById('futsalsGrid');
    const empty = document.getElementById('emptyFutsals');
    if (!futsals || futsals.length === 0) {
      empty.classList.remove('hidden');
      grid.innerHTML = '';
      return;
    }
    empty.classList.add('hidden');
    grid.innerHTML = futsals.map(f => `
      <div class="slot-card">
        ${f.imageUrl ? `<img src="${resolveImageUrl(f.imageUrl)}" alt="${f.name}" onerror="this.style.display='none'" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px;border:1px solid var(--border)">` : ''}
        <div class="slot-date">🏟️ ${f.name}</div>
        <div class="text-muted text-sm mb-1">📍 ${f.address}, ${f.city}</div>
        <div class="text-muted text-sm mb-2">📞 ${f.phone}</div>
        <div class="text-muted text-sm mb-1">🕒 Opens: ${f.openingTime ? formatTime(f.openingTime) : '—'}</div>
        <div class="text-muted text-sm mb-2">💰 NPR ${f.hourlyPrice ?? '—'} / hour</div>
        ${f.description ? `<div class="text-muted text-sm mb-2">${f.description}</div>` : ''}
        <button class="btn btn-primary btn-full" onclick="selectFutsal(${f.futsalId}, '${f.name.replace(/'/g, "\\'")}')">
          Select & View Slots
        </button>
      </div>
    `).join('');
  }

  function selectFutsal(id, name) {
    FutsalStore.save({ futsalId: id, name });
    window.location.href = 'slots.html';
  }

  loadFutsals();
</script>
</body>
</html>

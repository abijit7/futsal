<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fallback artwork for a venue with no uploaded photo. One of 4 variants picked from the venue
  id, so a listing page of unphotographed venues does not repeat one image down the whole grid.
  Self-hosted on purpose: the previous fallback hot-linked Unsplash, which put a third party in
  the render path of every venue card and forced a remote origin into the Content-Security-Policy.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Centre circle of a futsal court">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101F3A"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
    <pattern id="turf" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="url(#ground)"/>
      <rect width="90" height="45" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="900" height="650" fill="url(#turf)"/>

  <g fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="3">
    <line x1="450" y1="0" x2="450" y2="650"/>
    <circle cx="450" cy="325" r="210"/>
    <circle cx="450" cy="325" r="10" fill="#38bdf8" fill-opacity="0.55" stroke="none"/>
    <path d="M40 60 h120 M40 60 v80"/>
    <path d="M860 590 h-120 M860 590 v-80"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fallback artwork for a venue with no uploaded photo. One of 4 variants picked from the venue
  id, so a listing page of unphotographed venues does not repeat one image down the whole grid.
  Self-hosted on purpose: the previous fallback hot-linked Unsplash, which put a third party in
  the render path of every venue card and forced a remote origin into the Content-Security-Policy.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Corner of a futsal court">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2113"/>
      <stop offset="100%" stop-color="#161A1E"/>
    </linearGradient>
    <pattern id="turf" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="url(#ground)"/>
      <rect width="45" height="90" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="900" height="650" fill="url(#turf)"/>

  <g fill="none" stroke="#84cc16" stroke-opacity="0.5" stroke-width="3">
    <path d="M80 570 h760"/>
    <path d="M80 40 v530"/>
    <path d="M80 530 a40,40 0 0 0 40,40"/>
    <path d="M300 570 v-190 h330 v190"/>
    <path d="M400 570 v-90 h130 v90"/>
    <circle cx="465" cy="420" r="5" fill="#84cc16" fill-opacity="0.6" stroke="none"/>
  </g>
</svg>
